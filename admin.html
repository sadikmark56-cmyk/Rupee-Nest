<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rupee Nest Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

<header class="topbar">
  <div>
    <div class="brand">₹ Rupee Nest Admin</div>
    <div class="muted">Control Center</div>
  </div>
</header>

<main>
<section class="page active">

  <div class="hero">
    <span class="pill">ADMIN</span>
    <h1>App Settings</h1>
    <p>Change rewards and limits without editing the app code.</p>
  </div>

  <div class="card">

    <label>Watch reward (₹)</label>
    <input id="watchReward" type="number" step="0.01">

    <label>Daily ad limit</label>
    <input id="dailyAdLimit" type="number">

    <label>Referral reward (₹)</label>
    <input id="referralReward" type="number" step="0.01">

    <label>Minimum withdrawal (₹)</label>
    <input id="minimumWithdraw" type="number">

    <label>Minimum successful referrals</label>
    <input id="minimumReferrals" type="number">

    <button id="save" class="primary">Save Settings</button>

    <div id="status" class="small"></div>

  </div>

  <div class="card">
    <b>Next modules</b>
    <p class="muted">
      Users, withdrawal approvals/rejections, redeem-code management
      and dashboard will use the same secure admin backend.
    </p>
  </div>

</section>
</main>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const email = prompt("Admin email:");
const pass = prompt("Admin password:");

const watchReward = document.getElementById("watchReward");
const dailyAdLimit = document.getElementById("dailyAdLimit");
const referralReward = document.getElementById("referralReward");
const minimumWithdraw = document.getElementById("minimumWithdraw");
const minimumReferrals = document.getElementById("minimumReferrals");

const saveButton = document.getElementById("save");
const statusBox = document.getElementById("status");

async function run() {

  try {

    statusBox.textContent = "Checking admin access...";

    await signInWithEmailAndPassword(auth, email, pass);

    const settingsRef = doc(db, "settings", "appSettings");
    const snapshot = await getDoc(settingsRef);

    const data = snapshot.exists()
      ? snapshot.data()
      : {
          watchReward: 1,
          dailyAdLimit: 20,
          referralReward: 5,
          minimumWithdraw: 100,
          minimumReferrals: 5
        };

    watchReward.value = data.watchReward ?? 1;
    dailyAdLimit.value = data.dailyAdLimit ?? 20;
    referralReward.value = data.referralReward ?? 5;
    minimumWithdraw.value = data.minimumWithdraw ?? 100;
    minimumReferrals.value = data.minimumReferrals ?? 5;

    statusBox.textContent = "";

    saveButton.addEventListener("click", async () => {

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";
      statusBox.textContent = "Saving settings...";

      try {

        const settings = {
          watchReward: Number(watchReward.value),
          dailyAdLimit: Number(dailyAdLimit.value),
          referralReward: Number(referralReward.value),
          minimumWithdraw: Number(minimumWithdraw.value),
          minimumReferrals: Number(minimumReferrals.value)
        };

        await setDoc(
          settingsRef,
          settings,
          { merge: true }
        );

        statusBox.textContent = "✅ Settings Saved Successfully!";
        statusBox.style.color = "#22c55e";

        saveButton.textContent = "Saved ✓";

        setTimeout(() => {
          saveButton.textContent = "Save Settings";
        }, 2000);

      } catch (error) {

        console.error(error);

        statusBox.textContent =
          "❌ Save failed: " + error.message;

        statusBox.style.color = "#ef4444";

        saveButton.textContent = "Save Settings";

      } finally {

        saveButton.disabled = false;

      }

    });

  } catch (error) {

    console.error(error);

    document.body.innerHTML = `
      <div class="card" style="margin:20px">
        <h2>Admin Login Failed</h2>
        <p>Check your email/password and Firebase Rules.</p>
        <p style="color:#ef4444">${error.message}</p>
      </div>
    `;

  }

}

run();

</script>

</body>
</html>
