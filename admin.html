<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rupee Nest Admin</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><header class="topbar"><div><div class="brand">₹ Rupee Nest Admin</div><div class="muted">Control Center</div></div></header>
<main>
<section class="page active"><div class="hero"><span class="pill">ADMIN</span><h1>App Settings</h1><p>Change rewards and limits without editing the app code.</p></div>
<div class="card">
<label>Watch reward (₹)</label><input id="watchReward" type="number" step="0.01">
<label>Daily ad limit</label><input id="dailyAdLimit" type="number">
<label>Referral reward (₹)</label><input id="referralReward" type="number" step="0.01">
<label>Minimum withdrawal (₹)</label><input id="minimumWithdraw" type="number">
<label>Minimum successful referrals</label><input id="minimumReferrals" type="number">
<button id="save" class="primary">Save Settings</button><div id="status" class="small"></div>
</div>
<div class="card"><b>Next modules</b><p class="muted">Users, withdrawal approvals/rejections, redeem-code management and dashboard will use the same secure admin backend.</p></div>
</section></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const email=prompt("Admin email:"),pass=prompt("Admin password:");
async function run(){
 try{
  await signInWithEmailAndPassword(auth,email,pass);
  const s=await getDoc(doc(db,"settings","appSettings")); const d=s.exists()?s.data():{watchReward:1,dailyAdLimit:20,referralReward:5,minimumWithdraw:100,minimumReferrals:5};
  for(const k of Object.keys(d)) if(document.getElementById(k)) document.getElementById(k).value=d[k];
  document.getElementById("save").onclick=async()=>{const x={watchReward:Number(watchReward.value),dailyAdLimit:Number(dailyAdLimit.value),referralReward:Number(referralReward.value),minimumWithdraw:Number(minimumWithdraw.value),minimumReferrals:Number(minimumReferrals.value)};await setDoc(doc(db,"settings","appSettings"),x,{merge:true});status.textContent="Saved ✓";};
 }catch(e){document.body.innerHTML="<div class='card' style='margin:20px'>Admin login failed. Check email/password and Firebase Rules.</div>"}
} run();
</script></body></html>
